services:
  postgres:
    image: postgres:16-alpine
    container_name: mohamed-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mohamed
    volumes:
      - mohamed_pg_data:/var/lib/postgresql/data

volumes:
  mohamed_pg_data:
